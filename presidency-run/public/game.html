<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presidency Run — Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #konva-container { cursor: default; }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0A0A1A;
      color: #FFD700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 18px;
      z-index: 999;
      letter-spacing: 2px;
    }
    #loading-bar-wrap {
      width: 300px;
      height: 8px;
      background: #1A1A2E;
      border: 1px solid #FFD700;
      margin-top: 16px;
    }
    #loading-bar {
      height: 100%;
      background: #FFD700;
      width: 0%;
      transition: width 0.1s;
    }
    #loading-text {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div>LOADING PRESIDENCY RUN</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-text">Initialising...</div>
  </div>
  <div id="konva-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/konva@10/konva.min.js"></script>
  <script src="/js/cards-browser.js"></script>
  <script src="/js/news-headlines.js"></script>
  <script src="/js/client.js"></script>
  <script src="/js/konva-ui.js"></script>
</body>
</html>
