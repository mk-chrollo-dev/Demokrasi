<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presidency Run — Game</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="game-root">
    <div id="end-screen" class="hidden end-screen panel">
      <h1>GAME OVER</h1>
      <div class="winner-text" id="winner-display"></div>
      <div id="score-display"></div>
      <button class="btn btn-gold mt2" id="btn-play-again">Main Lagi</button>
    </div>

    <div id="game-ui">
      <!-- Status bar -->
      <div class="status-bar">
        <span id="round-label">Round 1 / 7</span>
        <span id="turn-label">Turn 1</span>
        <span id="active-label" style="font-weight:700; color:var(--accent);">— menunggu —</span>
      </div>

      <!-- Board: both players' aspects -->
      <div class="board">
        <div class="player-panel" id="panel-p1">
          <h3 id="p1-label">P1</h3>
          <div id="p1-aspects"></div>
          <div style="font-size:.75rem; color:var(--muted); margin-top:.5rem;">
            <span id="p1-deck">Deck: ?</span> &nbsp;
            <span id="p1-hand-size">Hand: ?</span> &nbsp;
            <span id="p1-fp">FP: —</span>
          </div>
          <div id="p1-effects" style="font-size:.72rem; color:var(--accent2); margin-top:.3rem;"></div>
        </div>
        <div class="player-panel" id="panel-p2">
          <h3 id="p2-label">P2</h3>
          <div id="p2-aspects"></div>
          <div style="font-size:.75rem; color:var(--muted); margin-top:.5rem;">
            <span id="p2-deck">Deck: ?</span> &nbsp;
            <span id="p2-hand-size">Hand: ?</span> &nbsp;
            <span id="p2-fp">FP: —</span>
          </div>
          <div id="p2-effects" style="font-size:.72rem; color:var(--accent2); margin-top:.3rem;"></div>
        </div>
      </div>

      <!-- Hand (only shown to the active player) -->
      <div class="hand-area" id="hand-area">
        <h3>Tanganmu <span id="hand-count" style="color:var(--muted);"></span></h3>
        <div class="hand-cards" id="hand-cards"></div>
      </div>

      <!-- Action buttons -->
      <div class="actions-bar" id="actions-bar">
        <button class="btn btn-danger hidden" id="btn-activate-fp">⚡ Aktifkan Foul Play</button>
        <button class="btn btn-primary" id="btn-end-turn" disabled>Akhiri Giliran</button>
      </div>

      <!-- News / peek notice -->
      <div id="peek-notice" class="notice info hidden"></div>

      <!-- Action log -->
      <div class="log-panel" id="log-panel">
        <div class="log-entry" style="color:var(--muted);">— Log aksi —</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
  <script src="/js/game-ui.js"></script>
</body>
</html>
